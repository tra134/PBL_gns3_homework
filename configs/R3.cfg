hostname R3
no ip domain-lookup
interface GigabitEthernet0/0
 description WAN_R3_R0
 ip address 10.0.41.1 255.255.255.0
 no shutdown
exit
interface GigabitEthernet0/1
 description LAN_D
 ip address 192.168.40.1 255.255.255.0
 no shutdown
exit
interface GigabitEthernet0/2
 description WAN_R3_R2
 ip address 10.0.34.2 255.255.255.0
 no shutdown
exit
router rip
 version 2
 no auto-summary
 network 192.168.40.0
 network 10.0.34.0
 network 10.0.41.0
exit
end
write memory
