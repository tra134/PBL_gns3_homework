hostname R0
no ip domain-lookup
interface GigabitEthernet0/0
 description LAN_A
 ip address 192.168.10.1 255.255.255.0
 no shutdown
exit
interface GigabitEthernet0/1
 description WAN_R0_R1
 ip address 10.0.12.1 255.255.255.252
 no shutdown
exit
interface GigabitEthernet0/2
 description WAN_R0_R3
 ip address 10.0.41.2 255.255.255.0
 no shutdown
exit
router rip
 version 2
 no auto-summary
 network 192.168.10.0
 network 10.0.12.0
 network 10.0.41.0
exit
end
write memory
