hostname R2
no ip domain-lookup
interface GigabitEthernet0/0
 description WAN_R2_R1
 ip address 10.0.23.2 255.255.255.0
 no shutdown
exit
interface GigabitEthernet0/1
 description LAN_C
 ip address 192.168.30.1 255.255.255.0
 no shutdown
exit
interface GigabitEthernet0/2
 description WAN_R2_R3
 ip address 10.0.34.1 255.255.255.0
 no shutdown
exit
router rip
 version 2
 no auto-summary
 network 192.168.30.0
 network 10.0.23.0
 network 10.0.34.0
exit
end
write memory
